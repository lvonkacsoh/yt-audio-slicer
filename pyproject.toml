[project]
name = "yt-audio-slicer"
version = "0.1.0"
description = "Download YouTube videos / playlists as tagged MP3 tracks, and keep the music library tidy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Laszlo von Kacsoh" }]
requires-python = ">=3.11"
keywords = ["youtube", "yt-dlp", "mp3", "id3", "music-library", "chapters", "musicbrainz", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Utilities",
]
dependencies = [
    "mutagen>=1.48.1",
    "rich>=15.0.0",
    "yt-dlp>=2026.11.23",
]

[project.urls]
Homepage = "https://github.com/<your-github-user>/yt-audio-slicer"
Issues = "https://github.com/<your-github-user>/yt-audio-slicer/issues"

[project.scripts]
yt-audio-slicer = "yt_audio_slicer.cli:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode characters: dashes and quotes are matched on purpose
    "RUF002",
    "RUF003",
    "SIM108",  # ternaries are not always clearer
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
